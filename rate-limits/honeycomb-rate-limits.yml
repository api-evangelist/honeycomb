specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Honeycomb
providerId: honeycomb
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Observability
description: Honeycomb ingest and query API rate limits per environment.
sources:
  - https://www.honeycomb.io/pricing
  - https://docs.honeycomb.io/api/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  tooManyRequests: 429
limits:
  - name: Events ingest
    scope: environment
    metric: events_per_second
    limit: scales with plan
  - name: Batch size (events)
    scope: request
    metric: events
    limit: 1000
    timeFrame: request
  - name: Query Data API
    scope: team
    metric: queries_per_second
    limit: 5
    timeFrame: second
  - name: Triggers and SLOs
    scope: environment
    metric: evaluations_per_minute
    limit: scales with plan
