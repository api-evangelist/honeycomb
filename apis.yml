  - url: openapi/honeycomb-environments-api-openapi.yml
    type: OpenAPI
  description: >-
    The Honeycomb Environments API provides administrative capabilities for managing environments within
    a Honeycomb team. Environments allow organizations to separate telemetry data across different stages
    such as development, staging, and production. The API supports listing, creating, updating, and deleting
    environments, along with the Auth API for validating API keys and determining their associated team
    and environment permissions.
