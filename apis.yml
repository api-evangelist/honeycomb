apis:
- aid: honeycomb:events-api
  name: Honeycomb Events API
  tags:
  - Event
  - Ingestion
  - Observability
  - Telemetry
  tags_raw:
  - Events
  - Ingestion
  - Observability
  - Telemetry
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.honeycomb.io
  humanURL: https://api-docs.honeycomb.io/api/events
  properties:
  - url: https://api-docs.honeycomb.io/api/events
    type: Documentation
  - url: openapi/honeycomb-events-api-openapi.yml
    type: OpenAPI
  - url: asyncapi/honeycomb-streaming-asyncapi.yml
    type: AsyncAPI
  - type: JSONSchema
    url: json-schema/honeycomb-batch-event-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-batch-event-response-schema.json
  description: The Honeycomb Events API is the lowest-level interface for sending event data to Honeycomb. It supports both single event creation
    and batch event submission, allowing developers to send structured telemetry data directly to Honeycomb datasets. While Honeycomb recommends
    using OpenTelemetry or Beeline SDKs for most instrumentation use cases, the Events API provides direct control for custom integrations and
    specialized data pipelines.
- aid: honeycomb:queries-api
  name: Honeycomb Queries API
  tags:
  - Analytics
  - Data Analysis
  - Observability
  - Query
  tags_raw:
  - Analytics
  - Data Analysis
  - Observability
  - Queries
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.honeycomb.io
  humanURL: https://api-docs.honeycomb.io/api/queries
  properties:
  - url: https://api-docs.honeycomb.io/api/queries
    type: Documentation
  - url: openapi/honeycomb-queries-api-openapi.yml
    type: OpenAPI
  - type: JSONSchema
    url: json-schema/honeycomb-query-spec-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-query-schema.json
  description: The Honeycomb Queries API allows developers to programmatically create and manage query specifications within Honeycomb. Queries
    are used to identify and reference queries across other parts of the API, including boards, triggers, and query annotations. Developers can
    run queries asynchronously by creating a Query Result that references a Query ID, then polling the query result endpoint until the data is
    ready. The Query Data API complements this by providing access to query results.
- aid: honeycomb:datasets-api
  name: Honeycomb Datasets API
  tags:
  - Data Management
  - Datasets
  - Observability
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.honeycomb.io
  humanURL: https://api-docs.honeycomb.io/api/datasets
  properties:
  - url: https://api-docs.honeycomb.io/api/datasets
    type: Documentation
  - url: openapi/honeycomb-datasets-api-openapi.yml
    type: OpenAPI
  - type: JSONSchema
    url: json-schema/honeycomb-dataset-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-dataset-update-request-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-dataset-create-request-schema.json
  description: The Honeycomb Datasets API provides management capabilities for datasets, which represent collections of related events from the
    same source. It allows developers to list, create, and update datasets programmatically. The related Columns API enables management of fields
    within datasets, including listing, creating, updating, and deleting columns that define the structure of event data stored in Honeycomb.
- aid: honeycomb:boards-api
  name: Honeycomb Boards API
  tags:
  - Dashboards
  - Observability
  - Visualization
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.honeycomb.io
  humanURL: https://api-docs.honeycomb.io/api/boards
  properties:
  - url: https://api-docs.honeycomb.io/api/boards
    type: Documentation
  - url: openapi/honeycomb-boards-api-openapi.yml
    type: OpenAPI
  - type: JSONSchema
    url: json-schema/honeycomb-board-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-board-update-request-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-board-create-request-schema.json
  description: The Honeycomb Boards API allows developers to programmatically create and manage boards, which are collections of queries displayed
    together as a dashboard-like view. Boards provide a way to organize and share related queries for monitoring and debugging workflows. The
    API supports listing, creating, updating, and deleting boards, making it possible to automate the setup of observability dashboards across
    environments.
- aid: honeycomb:markers-api
  name: Honeycomb Markers API
  tags:
  - Annotation
  - Deployment
  - Markers
  - Observability
  tags_raw:
  - Annotations
  - Deployments
  - Markers
  - Observability
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.honeycomb.io
  humanURL: https://api-docs.honeycomb.io/api/marker-settings
  properties:
  - url: https://api-docs.honeycomb.io/api/marker-settings
    type: Documentation
  - url: openapi/honeycomb-markers-api-openapi.yml
    type: OpenAPI
  - type: JSONSchema
    url: json-schema/honeycomb-marker-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-marker-create-request-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-marker-update-request-schema.json
  description: The Honeycomb Markers API enables developers to create and manage markers that indicate points in time on graphs where notable
    events occurred, such as deploys, configuration changes, or outages. Marker Settings allow grouping similar markers together with consistent
    visual styling. The API supports listing, creating, updating, and deleting both markers and marker settings, making it straightforward to
    integrate deployment pipelines and incident workflows with Honeycomb visualizations.
