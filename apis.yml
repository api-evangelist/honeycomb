  - type: JSONSchema
    url: json-schema/honeycomb-trigger-create-request-schema.json
  - type: JSONSchema
    url: json-schema/honeycomb-trigger-update-request-schema.json
  description: The Honeycomb Triggers API allows developers to programmatically configure alerting rules that fire when query results meet specified
    conditions. Triggers work in conjunction with the Recipients API, which manages notification destinations including PagerDuty, Email, Webhook,
    Microsoft Teams, and Slack. The API supports listing, creating, updating, and deleting triggers, enabling automated setup of alerting workflows
    for production observability.
