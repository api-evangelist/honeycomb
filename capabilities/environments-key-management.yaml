naftiko: 1.0.0-alpha2
info:
  label: Honeycomb Environments API — Key Management
  description: 'Honeycomb Environments API — Key Management. 5 operations. Lead operation: List all API keys. Self-contained
    Naftiko capability covering one Honeycomb business surface.'
  tags:
  - Honeycomb
  - Key Management
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: environments-key-management
    baseUri: https://api.honeycomb.io
    description: Honeycomb Environments API — Key Management business capability. Self-contained, no shared references.
    resources:
    - name: 1-api_keys
      path: /1/api_keys
      operations:
      - name: listapikeys
        method: GET
        description: List all API keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createapikey
        method: POST
        description: Create an API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-api_keys-keyId
      path: /1/api_keys/{keyId}
      operations:
      - name: getapikey
        method: GET
        description: Get an API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateapikey
        method: PUT
        description: Update an API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteapikey
        method: DELETE
        description: Delete an API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: environments-key-management-rest
    port: 8080
    description: REST adapter for Honeycomb Environments API — Key Management. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/1/api-keys
      name: 1-api-keys
      description: REST surface for 1-api_keys.
      operations:
      - method: GET
        name: listapikeys
        description: List all API keys
        call: environments-key-management.listapikeys
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapikey
        description: Create an API key
        call: environments-key-management.createapikey
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/api-keys/{keyid}
      name: 1-api-keys-keyid
      description: REST surface for 1-api_keys-keyId.
      operations:
      - method: GET
        name: getapikey
        description: Get an API key
        call: environments-key-management.getapikey
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateapikey
        description: Update an API key
        call: environments-key-management.updateapikey
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapikey
        description: Delete an API key
        call: environments-key-management.deleteapikey
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: environments-key-management-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb Environments API — Key Management. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-all-api-keys
      description: List all API keys
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: environments-key-management.listapikeys
      outputParameters:
      - type: object
        mapping: $.
    - name: create-api-key
      description: Create an API key
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: environments-key-management.createapikey
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-api-key
      description: Get an API key
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: environments-key-management.getapikey
      outputParameters:
      - type: object
        mapping: $.
    - name: update-api-key
      description: Update an API key
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: environments-key-management.updateapikey
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-api-key
      description: Delete an API key
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: environments-key-management.deleteapikey
      outputParameters:
      - type: object
        mapping: $.
