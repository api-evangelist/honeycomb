naftiko: 1.0.0-alpha2
info:
  label: Honeycomb Environments API — Auth
  description: 'Honeycomb Environments API — Auth. 2 operations. Lead operation: Authenticate API key. Self-contained Naftiko
    capability covering one Honeycomb business surface.'
  tags:
  - Honeycomb
  - Auth
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: environments-auth
    baseUri: https://api.honeycomb.io
    description: Honeycomb Environments API — Auth business capability. Self-contained, no shared references.
    resources:
    - name: 1-auth
      path: /1/auth
      operations:
      - name: getauth
        method: GET
        description: Authenticate API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: 1-auth-permissions
      path: /1/auth/permissions
      operations:
      - name: listauthorizations
        method: GET
        description: List authorizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: environments-auth-rest
    port: 8080
    description: REST adapter for Honeycomb Environments API — Auth. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/1/auth
      name: 1-auth
      description: REST surface for 1-auth.
      operations:
      - method: GET
        name: getauth
        description: Authenticate API key
        call: environments-auth.getauth
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/auth/permissions
      name: 1-auth-permissions
      description: REST surface for 1-auth-permissions.
      operations:
      - method: GET
        name: listauthorizations
        description: List authorizations
        call: environments-auth.listauthorizations
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: environments-auth-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb Environments API — Auth. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: authenticate-api-key
      description: Authenticate API key
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: environments-auth.getauth
      outputParameters:
      - type: object
        mapping: $.
    - name: list-authorizations
      description: List authorizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: environments-auth.listauthorizations
      outputParameters:
      - type: object
        mapping: $.
