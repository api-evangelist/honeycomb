naftiko: 1.0.0-alpha2
info:
  label: Honeycomb Queries API — Queries
  description: 'Honeycomb Queries API — Queries. 2 operations. Lead operation: Create a query. Self-contained Naftiko capability
    covering one Honeycomb business surface.'
  tags:
  - Honeycomb
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: queries-queries
    baseUri: https://api.honeycomb.io
    description: Honeycomb Queries API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: 1-queries-datasetSlug
      path: /1/queries/{datasetSlug}
      operations:
      - name: createquery
        method: POST
        description: Create a query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-queries-datasetSlug-queryId
      path: /1/queries/{datasetSlug}/{queryId}
      operations:
      - name: getquery
        method: GET
        description: Get a query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: queries-queries-rest
    port: 8080
    description: REST adapter for Honeycomb Queries API — Queries. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/1/queries/{datasetslug}
      name: 1-queries-datasetslug
      description: REST surface for 1-queries-datasetSlug.
      operations:
      - method: POST
        name: createquery
        description: Create a query
        call: queries-queries.createquery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/queries/{datasetslug}/{queryid}
      name: 1-queries-datasetslug-queryid
      description: REST surface for 1-queries-datasetSlug-queryId.
      operations:
      - method: GET
        name: getquery
        description: Get a query
        call: queries-queries.getquery
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: queries-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb Queries API — Queries. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-query
      description: Create a query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: queries-queries.createquery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-query
      description: Get a query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: queries-queries.getquery
      outputParameters:
      - type: object
        mapping: $.
