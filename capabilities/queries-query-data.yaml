naftiko: 1.0.0-alpha2
info:
  label: Honeycomb Queries API — Query Data
  description: 'Honeycomb Queries API — Query Data. 1 operations. Lead operation: Run a query and get data. Self-contained
    Naftiko capability covering one Honeycomb business surface.'
  tags:
  - Honeycomb
  - Query Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: queries-query-data
    baseUri: https://api.honeycomb.io
    description: Honeycomb Queries API — Query Data business capability. Self-contained, no shared references.
    resources:
    - name: 1-query_data-datasetSlug
      path: /1/query_data/{datasetSlug}
      operations:
      - name: createquerydata
        method: POST
        description: Run a query and get data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: queries-query-data-rest
    port: 8080
    description: REST adapter for Honeycomb Queries API — Query Data. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/1/query-data/{datasetslug}
      name: 1-query-data-datasetslug
      description: REST surface for 1-query_data-datasetSlug.
      operations:
      - method: POST
        name: createquerydata
        description: Run a query and get data
        call: queries-query-data.createquerydata
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: queries-query-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb Queries API — Query Data. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: run-query-and-get-data
      description: Run a query and get data
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: queries-query-data.createquerydata
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
