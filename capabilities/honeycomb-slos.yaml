naftiko: 1.0.0-alpha2
info:
  label: Honeycomb API — SLOs
  description: 'Honeycomb API — SLOs. 5 operations. Lead operation: List all SLOs. Self-contained Naftiko capability covering
    one Honeycomb business surface.'
  tags:
  - Honeycomb
  - SLOs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: honeycomb-slos
    baseUri: https://api.honeycomb.io
    description: Honeycomb API — SLOs business capability. Self-contained, no shared references.
    resources:
    - name: 1-slos-datasetSlug
      path: /1/slos/{datasetSlug}
      operations:
      - name: listslos
        method: GET
        description: List all SLOs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createslo
        method: POST
        description: Create an SLO
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-slos-datasetSlug-sloId
      path: /1/slos/{datasetSlug}/{sloId}
      operations:
      - name: getslo
        method: GET
        description: Get an SLO
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateslo
        method: PUT
        description: Update an SLO
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteslo
        method: DELETE
        description: Delete an SLO
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: honeycomb-slos-rest
    port: 8080
    description: REST adapter for Honeycomb API — SLOs. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/1/slos/{datasetslug}
      name: 1-slos-datasetslug
      description: REST surface for 1-slos-datasetSlug.
      operations:
      - method: GET
        name: listslos
        description: List all SLOs
        call: honeycomb-slos.listslos
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createslo
        description: Create an SLO
        call: honeycomb-slos.createslo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/slos/{datasetslug}/{sloid}
      name: 1-slos-datasetslug-sloid
      description: REST surface for 1-slos-datasetSlug-sloId.
      operations:
      - method: GET
        name: getslo
        description: Get an SLO
        call: honeycomb-slos.getslo
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateslo
        description: Update an SLO
        call: honeycomb-slos.updateslo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteslo
        description: Delete an SLO
        call: honeycomb-slos.deleteslo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: honeycomb-slos-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb API — SLOs. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-slos
      description: List all SLOs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: honeycomb-slos.listslos
      outputParameters:
      - type: object
        mapping: $.
    - name: create-slo
      description: Create an SLO
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: honeycomb-slos.createslo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-slo
      description: Get an SLO
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: honeycomb-slos.getslo
      outputParameters:
      - type: object
        mapping: $.
    - name: update-slo
      description: Update an SLO
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: honeycomb-slos.updateslo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-slo
      description: Delete an SLO
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: honeycomb-slos.deleteslo
      outputParameters:
      - type: object
        mapping: $.
