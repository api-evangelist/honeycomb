naftiko: 1.0.0-alpha2
info:
  label: Honeycomb Boards API — Boards
  description: 'Honeycomb Boards API — Boards. 5 operations. Lead operation: List all boards. Self-contained Naftiko capability
    covering one Honeycomb business surface.'
  tags:
  - Honeycomb
  - Boards
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: boards-boards
    baseUri: https://api.honeycomb.io
    description: Honeycomb Boards API — Boards business capability. Self-contained, no shared references.
    resources:
    - name: 1-boards
      path: /1/boards
      operations:
      - name: listboards
        method: GET
        description: List all boards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createboard
        method: POST
        description: Create a board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-boards-boardId
      path: /1/boards/{boardId}
      operations:
      - name: getboard
        method: GET
        description: Get a board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateboard
        method: PUT
        description: Update a board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteboard
        method: DELETE
        description: Delete a board
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: boards-boards-rest
    port: 8080
    description: REST adapter for Honeycomb Boards API — Boards. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/1/boards
      name: 1-boards
      description: REST surface for 1-boards.
      operations:
      - method: GET
        name: listboards
        description: List all boards
        call: boards-boards.listboards
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createboard
        description: Create a board
        call: boards-boards.createboard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/boards/{boardid}
      name: 1-boards-boardid
      description: REST surface for 1-boards-boardId.
      operations:
      - method: GET
        name: getboard
        description: Get a board
        call: boards-boards.getboard
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateboard
        description: Update a board
        call: boards-boards.updateboard
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteboard
        description: Delete a board
        call: boards-boards.deleteboard
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: boards-boards-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb Boards API — Boards. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-all-boards
      description: List all boards
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boards-boards.listboards
      outputParameters:
      - type: object
        mapping: $.
    - name: create-board
      description: Create a board
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: boards-boards.createboard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-board
      description: Get a board
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: boards-boards.getboard
      outputParameters:
      - type: object
        mapping: $.
    - name: update-board
      description: Update a board
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: boards-boards.updateboard
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-board
      description: Delete a board
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: boards-boards.deleteboard
      outputParameters:
      - type: object
        mapping: $.
