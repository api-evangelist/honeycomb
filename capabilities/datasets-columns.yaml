    resources:
    - name: 1-columns-datasetSlug
      path: /1/columns/{datasetSlug}
      operations:
      - name: listcolumns
        method: GET
        description: List all columns
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcolumn
        method: POST
        description: Create a column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-columns-datasetSlug-columnId
      path: /1/columns/{datasetSlug}/{columnId}
      operations:
      - name: getcolumn
        method: GET
        description: Get a column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatecolumn
        method: PUT
        description: Update a column
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
