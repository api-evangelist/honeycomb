    port: 8080
    description: REST adapter for Honeycomb Triggers API — Triggers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/1/triggers/{datasetslug}
      name: 1-triggers-datasetslug
      description: REST surface for 1-triggers-datasetSlug.
      operations:
      - method: GET
        name: listtriggers
        description: List all triggers
        call: triggers-triggers.listtriggers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtrigger
        description: Create a trigger
        call: triggers-triggers.createtrigger
