    resources:
    - name: 1-triggers-datasetSlug
      path: /1/triggers/{datasetSlug}
      operations:
      - name: listtriggers
        method: GET
        description: List all triggers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtrigger
        method: POST
        description: Create a trigger
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-triggers-datasetSlug-triggerId
      path: /1/triggers/{datasetSlug}/{triggerId}
      operations:
      - name: gettrigger
        method: GET
        description: Get a trigger
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatetrigger
        method: PUT
        description: Update a trigger
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
