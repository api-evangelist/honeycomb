naftiko: 1.0.0-alpha2
info:
  label: Honeycomb Queries API — Query Results
  description: 'Honeycomb Queries API — Query Results. 2 operations. Lead operation: Create a query result. Self-contained
    Naftiko capability covering one Honeycomb business surface.'
  tags:
  - Honeycomb
  - Query Results
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HONEYCOMB_API_KEY: HONEYCOMB_API_KEY
capability:
  consumes:
  - type: http
    namespace: queries-query-results
    baseUri: https://api.honeycomb.io
    description: Honeycomb Queries API — Query Results business capability. Self-contained, no shared references.
    resources:
    - name: 1-query_results-datasetSlug
      path: /1/query_results/{datasetSlug}
      operations:
      - name: createqueryresult
        method: POST
        description: Create a query result
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-query_results-datasetSlug-queryResultId
      path: /1/query_results/{datasetSlug}/{queryResultId}
      operations:
      - name: getqueryresult
        method: GET
        description: Get a query result
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Honeycomb-Team
      value: '{{env.HONEYCOMB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: queries-query-results-rest
    port: 8080
    description: REST adapter for Honeycomb Queries API — Query Results. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/1/query-results/{datasetslug}
      name: 1-query-results-datasetslug
      description: REST surface for 1-query_results-datasetSlug.
      operations:
      - method: POST
        name: createqueryresult
        description: Create a query result
        call: queries-query-results.createqueryresult
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/1/query-results/{datasetslug}/{queryresultid}
      name: 1-query-results-datasetslug-queryresultid
      description: REST surface for 1-query_results-datasetSlug-queryResultId.
      operations:
      - method: GET
        name: getqueryresult
        description: Get a query result
        call: queries-query-results.getqueryresult
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: queries-query-results-mcp
    port: 9090
    transport: http
    description: MCP adapter for Honeycomb Queries API — Query Results. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-query-result
      description: Create a query result
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: queries-query-results.createqueryresult
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-query-result
      description: Get a query result
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: queries-query-results.getqueryresult
      outputParameters:
      - type: object
        mapping: $.
